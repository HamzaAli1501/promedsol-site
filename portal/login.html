<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Portal — ProMED Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#031428;--blue:#19569B;--cyan:#00E5FF;--slate:#B0BDCD}
html,body{min-height:100%;font-family:'Urbanist',system-ui,sans-serif;background:var(--navy);color:#fff}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px);
  background-size:60px 60px;animation:gridPulse 6s ease-in-out infinite}
@keyframes gridPulse{0%,100%{opacity:.4}50%{opacity:.85}}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.p{position:absolute;border-radius:50%;background:var(--cyan);opacity:0;animation:rise var(--d) var(--dl) ease-in-out infinite}
@keyframes rise{0%{opacity:0;transform:translateY(100vh) scale(.3)}15%{opacity:.5}85%{opacity:.15}100%{opacity:0;transform:translateY(-10vh) scale(1.2)}}
.ring-deco{position:fixed;right:6%;top:50%;transform:translateY(-50%);width:260px;height:260px;pointer-events:none;z-index:0;perspective:600px;opacity:.3}
.ring-deco div{position:absolute;width:100%;height:100%;border-radius:50%;border:1.5px solid rgba(0,229,255,.35);animation:rot 13s linear infinite}
.ring-deco div:nth-child(2){width:72%;height:72%;top:14%;left:14%;animation-duration:9s;animation-direction:reverse;border-color:rgba(25,86,155,.5)}
.ring-deco div:nth-child(3){width:48%;height:48%;top:26%;left:26%;animation-duration:6s}
@keyframes rot{to{transform:rotateX(62deg) rotateZ(360deg)}}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:44px;text-decoration:none}
.brand-name{font-size:22px;font-weight:900;letter-spacing:-.4px;display:block;
  background:linear-gradient(135deg,#fff,var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.brand-tag{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(176,189,205,.55);display:block;margin-top:2px}
.card{width:100%;max-width:420px;background:rgba(255,255,255,.045);border:1px solid rgba(0,229,255,.14);
  border-radius:22px;padding:42px 38px 38px;backdrop-filter:blur(22px);
  box-shadow:0 36px 90px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.04)}
.card-title{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:5px}
.card-sub{font-size:.88rem;color:var(--slate);margin-bottom:30px;line-height:1.55}
.error-msg{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);
  border-radius:8px;padding:10px 14px;color:#fca5a5;font-size:.85rem;font-weight:600;margin-bottom:18px}
.error-msg.visible{display:block}
.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.form-group{margin-bottom:18px}
label{display:block;font-size:.76rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--slate);margin-bottom:6px}
.input-wrap{position:relative}
.input-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;opacity:.4;pointer-events:none}
input{width:100%;padding:12px 14px 12px 38px;border-radius:9px;border:1.5px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:.95rem;outline:none;
  transition:border-color .25s,box-shadow .25s,background .25s}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.12);background:rgba(255,255,255,.09)}
input::placeholder{color:rgba(176,189,205,.35)}
.btn{width:100%;padding:13px;margin-top:8px;border:none;border-radius:9px;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-family:inherit;
  font-size:1rem;font-weight:700;letter-spacing:.04em;transition:transform .25s,box-shadow .25s,opacity .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(0,229,255,.28)}
.btn.loading{opacity:.7;pointer-events:none}
.btn-spinner{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.btn.loading .btn-text{display:none}
.btn.loading .btn-spinner{display:block}
.back{margin-top:26px;text-align:center;font-size:.82rem;color:rgba(176,189,205,.45)}
.back a{color:rgba(176,189,205,.65);text-decoration:none;transition:color .2s}
.back a:hover{color:var(--cyan)}
@media(max-width:600px){.ring-deco{display:none}}
</style>
</head>
<body>
<div class="particles" id="ptcls"></div>
<div class="ring-deco"><div></div><div></div><div></div></div>
<div class="page">
  <a href="../index.html" class="brand">
    <div>
      <span class="brand-name">ProMED Solutions</span>
      <span class="brand-tag">Customer Portal</span>
    </div>
  </a>
  <div class="card" id="loginCard">
    <h1 class="card-title">Welcome back</h1>
    <p class="card-sub">Sign in to access your MRI monitoring dashboard</p>
    <div class="error-msg" id="errorMsg">Invalid username or password. Please try again.</div>
    <div class="form-group">
      <label for="username">Username</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
      </div>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
      </div>
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">
      <span class="btn-text">Sign In</span>
      <div class="btn-spinner"></div>
    </button>
  </div>
  <p class="back"><a href="../index.html">← Back to promedsol.com.pk</a></p>
</div>
<script>
(function(){
  var w=document.getElementById('ptcls');
  for(var i=0;i<20;i++){
    var el=document.createElement('div');el.className='p';
    var s=2+Math.random()*4;
    el.style.cssText='left:'+Math.random()*100+'%;width:'+s+'px;height:'+s+'px;--d:'+(8+Math.random()*10)+'s;--dl:-'+(Math.random()*12)+'s';
    w.appendChild(el);
  }
})();

// If already logged in, go straight to dashboard
if(sessionStorage.getItem('promed_auth')==='true'){
  window.location.href='dashboard.html';
}

// ========== AUTHORISED USERS ==========
// Add or remove users here — format: 'username': 'password'
var USERS = {
  'ProMed-Solution' : '123456789',
  'IDC-Islamabad'   : 'IDC@2024',
  'IDC-Lahore'      : 'IDC@2024',
  'IDC-Multan'      : 'IDC@2024',
  'IDC-Karachi'     : 'IDC@2024',
  'IDC-Peshawar'    : 'IDC@2024',
  'ProMED-Admin'    : 'Admin@ProMED2024'
};

function doLogin(){
  var user=document.getElementById('username').value.trim();
  var pass=document.getElementById('password').value.trim();
  var btn=document.getElementById('loginBtn');
  var err=document.getElementById('errorMsg');
  var card=document.getElementById('loginCard');

  btn.classList.add('loading');
  err.classList.remove('visible');

  setTimeout(function(){
    if(USERS[user] && USERS[user]===pass){
      sessionStorage.setItem('promed_auth','true');
      sessionStorage.setItem('promed_user', user);
      window.location.href='dashboard.html';
    } else {
      btn.classList.remove('loading');
      err.classList.add('visible');
      card.classList.add('shake');
      setTimeout(function(){card.classList.remove('shake')},400);
    }
  },800);
}

document.addEventListener('keydown',function(e){
  if(e.key==='Enter') doLogin();
});
</script>
</body>
</html>
