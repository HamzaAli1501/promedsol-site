<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Portal — ProMED Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#031428;--blue:#19569B;--cyan:#00E5FF;--slate:#B0BDCD;--white:#fff}
html,body{height:100%;font-family:'Urbanist',system-ui,sans-serif;background:var(--navy);color:var(--white)}

/* animated grid background */
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px);
  background-size:60px 60px;
  animation:gridPulse 6s ease-in-out infinite;
}
@keyframes gridPulse{0%,100%{opacity:.4}50%{opacity:.9}}

.page{
  position:relative;z-index:1;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 16px;
}

/* logo bar */
.portal-brand{
  display:flex;align-items:center;gap:12px;
  margin-bottom:40px;text-decoration:none;
}
.portal-brand-name{font-size:22px;font-weight:900;letter-spacing:-.5px;
  background:linear-gradient(135deg,#fff,var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.portal-brand-tag{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(176,189,205,.6);display:block;margin-top:1px}

/* card */
.card{
  width:100%;max-width:440px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(0,229,255,.14);
  border-radius:20px;
  padding:40px 36px;
  backdrop-filter:blur(18px);
  box-shadow:0 32px 80px rgba(0,0,0,.4);
}
.card-title{font-size:1.6rem;font-weight:800;margin-bottom:4px;letter-spacing:-.02em}
.card-sub{font-size:.9rem;color:var(--slate);margin-bottom:28px}

/* flash messages */
.flash{border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:.875rem;font-weight:600}
.flash.error{background:rgba(255,80,80,.12);border:1px solid rgba(255,80,80,.3);color:#ff8080}
.flash.success{background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.25);color:var(--cyan)}

/* form */
.form-group{margin-bottom:18px}
label{display:block;font-size:.8rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--slate);margin-bottom:6px}
input[type=text],input[type=password],input[type=email]{
  width:100%;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:.95rem;
  transition:border-color .25s,box-shadow .25s;outline:none;
}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.12)}
input::placeholder{color:rgba(176,189,205,.4)}

.btn-primary{
  width:100%;padding:13px;border:none;border-radius:8px;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  color:#fff;font-family:inherit;font-size:1rem;font-weight:700;letter-spacing:.03em;
  transition:transform .25s,box-shadow .25s;margin-top:6px;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,229,255,.25)}

.card-footer{margin-top:22px;text-align:center;font-size:.875rem;color:var(--slate)}
.card-footer a{color:var(--cyan);text-decoration:none;font-weight:600}
.card-footer a:hover{text-decoration:underline}

.back-link{margin-top:28px;font-size:.82rem;color:rgba(176,189,205,.5);text-align:center}
.back-link a{color:rgba(176,189,205,.7);text-decoration:none}
.back-link a:hover{color:var(--cyan)}
</style>
</head>
<body>
<div class="page">

  <a href="/" class="portal-brand">
    <div>
      <span class="portal-brand-name">ProMED Solutions</span>
      <span class="portal-brand-tag">Customer Portal</span>
    </div>
  </a>

  <div class="card">
    <h1 class="card-title">Welcome back</h1>
    <p class="card-sub">Sign in to your MRI monitoring dashboard</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="Your username" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Your password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
    </form>
  </div>

  <p class="back-link"><a href="/">← Back to promedsol.com.pk</a></p>

</div>
</body>
</html>
